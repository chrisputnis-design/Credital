<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for og.png (1200x630). Render with any headless browser at that viewport and screenshot the page. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#0A1F44;font-family:Inter,system-ui,sans-serif;color:#fff;position:relative;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(45% 70% at 82% 55%,rgba(29,63,119,.55),transparent 70%),radial-gradient(50% 60% at 0% 0%,rgba(46,79,134,.6),transparent 70%)}
  .logo{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700;letter-spacing:-.02em}
  h1{position:absolute;left:72px;top:200px;width:660px;font-size:64px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
  h1 span{display:block}
  
  .sub{position:absolute;left:72px;bottom:64px;font-size:26px;color:rgba(255,255,255,.75)}
  .card{position:absolute;right:72px;top:170px;width:360px;background:#fff;color:#0A1F44;border-radius:24px;padding:28px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
  .row{display:flex;justify-content:space-between;align-items:center}
  .k{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569}
  .b{background:#0A1F44;color:#fff;border-radius:8px;padding:4px 12px;font-weight:700;font-size:18px}
  .big{margin-top:22px;font-size:64px;font-weight:800;letter-spacing:-.03em}
  .big small{font-size:24px;font-weight:600;color:#1D3F77;margin-left:6px}
  .meta{margin-top:6px;font-size:20px;color:#475569}
  .bar{margin-top:22px;height:12px;border-radius:99px;background:#E2E8F0;overflow:hidden}
  .bar i{display:block;height:100%;width:62%;background:#1D3F77}
  .foot{margin-top:10px;font-size:16px;color:#475569}
  .ill{position:absolute;right:72px;top:96px;width:360px;text-align:right;font-size:15px;color:rgba(255,255,255,.65)}
</style></head>
<body>
<div class="glow"></div>
<div class="logo"><svg width="46" height="46" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#FFFFFF"/><path d="M21.5 11.2A7.2 7.2 0 1 0 21.5 20.8" fill="none" stroke="#0A1F44" stroke-width="3.2" stroke-linecap="round"/><circle cx="22.8" cy="16" r="2.1" fill="#0A1F44"/></svg>Credital</div>
<h1><span>Earn interest by lending to verified borrowers.</span></h1>
<p class="sub">A lending marketplace. Capital at risk.</p>
<p class="ill">Illustrative listing</p>
<div class="card">
  <div class="row"><span class="k">Example loan</span><span class="b">BBB</span></div>
  <div class="big">12.0%<small>a year</small></div>
  <p class="meta">$500 &middot; 12 months</p>
  <div class="bar"><i></i></div>
  <p class="foot">Illustration only</p>
</div>
</body></html>
